services:
  - type: web
    name: contact-book
    runtime: node
    buildCommand: npm ci --prefix frontend --include=dev && npm run build && npm ci --prefix backend --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 16.20.2
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: contact_book_production
